<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meu Projeto Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
 <link rel="stylesheet" href="./assets/css/styles.css">

 <!-- Google fonts -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Petrona&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">


</head>
<body>

<div class="container bd">
    <div class="head1 container text-center text-light">
        <div class="row">
            <div class="col-12">
                <img class="logo" src="./assets/images/logo_of_1.png" alt="logo minha meta">
            </div>
        </div>
    </div>

    <div class="container">
        <h1 class="title1">Gestão de Contatos</h1>
        <div id="line"></div>

        <!-- Formulário para Adicionar Contato -->
        <div class="p-4">
            <h2 class="title1">Adicionar Novo Contato</h2>
            <form id="add-contact-form">
                <div class="mb-3">
                    <label for="name" class="form-label text-light">Nome</label>
                    <input type="text" class="form-control" id="name" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label text-light">Telefone</label>
                    <input type="tel" class="form-control" id="phone" required>
                </div>
                <div class="mb-3">
                    <label for="status" class="form-label text-light">Status</label>
                    <select class="form-select" id="status">
                        <option>Contato não efetuado</option>
                        <option>Contato efetuado</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Adicionar Contato</button>
            </form>
        </div>

        <div id="line"></div>

        <!-- Área para Colar Dados da Planilha -->
        <div class="p-4">
            <h2 class="title1">Colar Dados da Planilha</h2>
            <div class="mb-3">
                <textarea class="form-control" id="spreadsheet-data" rows="5" placeholder="Cole aqui os dados da planilha (Nome, Telefone, Status), separados por tabulação."></textarea>
            </div>
            <button id="paste-data-btn" class="btn btn-secondary">Adicionar Contatos da Planilha</button>
        </div>

        <div id="line"></div>

        <!-- Lista de Contatos -->
        <div class="p-4">
            <h2 class="title1">Lista de Contatos</h2>
            <div id="contact-list" class="lista-lancamentos">
                <!-- Contatos serão adicionados aqui via JavaScript -->
            </div>
        </div>
    </div>
</div>

<script src="./assets/js/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
